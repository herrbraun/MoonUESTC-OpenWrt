name: Offline platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ (github.head_ref || github.ref_name) == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - if: (github.head_ref || github.ref_name) == 'linux'
        run: python tools/check_systemd.py
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: node tests/check_ui.cjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
