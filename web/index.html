async function refresh(){if(S.busy){S.again=true;return}S.busy=true;try{let r=await fetch('./accounts.json',{cache:'no-store'});if(!r.ok)throw Error('无法读取账号');let date=Date.parse(r.headers.get('Date'));if(Number.isFinite(date))S.offset=date-Date.now();let v=await r.json();S.accounts=v.accounts||[];if(!S.accounts.some(a=>a.id===S.id))S.id=S.accounts[0]?.id||'';let select=$('account-select');select.replaceChildren();for(const a of S.accounts){let o=document.createElement('option');o.value=a.id;o.textContent=a.label+' · '+a.studentMask;select.append(o)}if(!S.accounts.length){let o=document.createElement('option');o.textContent='暂无账号';select.append(o)}select.value=S.id;let state={},aid=S.id;if(aid){let r=await fetch('./status-'+encodeURIComponent(aid)+'.json',{cache:'no-store'});if(r.ok)state=await r.json()}if(aid!==S.id)return;render(state);$('connection').classList.remove('offline');text('connection-text','已连接');err('page-error','');if(state.busy&&!S.poll)S.poll=setInterval(refresh,2000);if(!state.busy&&S.poll){clearInterval(S.poll);S.poll=null}}catch(e){$('connection').classList.add('offline');text('connection-text','未连接');err('page-error',e)}finally{S.busy=false;if(S.again){S.again=false;refresh()}}}
async function editor(id){let r=await api('get',id?{id}:{}),a=r.account;S.edit=id||null;$('account-form').reset();text('dialog-title',id?'编辑账号':'添加账号');$('label').value=a.label||'';$('student-id').value=a.student_id||'';$('school-password').value='';$('fingerprint').value='';$('school-password').required=!id;$('fingerprint').required=!id;$('school-password').placeholder=a.password_saved?'已保存，留空不改':'学校统一认证密码';$('fingerprint').placeholder=a.fingerprint_saved?'已保存，留空不改':'32位浏览器指纹';$('run-at').value=a.run_at||'21:01';$('enabled').checked=a.automation_enabled!==false;let loc=a.location||{};$('location-name').value=loc.name||'欣苑组团';$('latitude').value=loc.latitude??30.674521;$('longitude').value=loc.longitude??104.096295;$('delete').hidden=!id;$('new-account-spacer').hidden=!!id;$('location-details').open=false;err('account-error','');$('account-dialog').showModal()}
$('account-select').addEventListener('change',e=>{S.id=e.target.value;localStorage.setItem('moonuestc-account',S.id);S.status=null;render();refresh()});$('add').onclick=()=>guard(()=>editor());$('edit').onclick=()=>guard(()=>editor(S.id));$('diagnose').onclick=()=>guard(async()=>{try{await api('diagnose',{id:S.id});toast('检查中');await refresh()}catch(e){err('page-error',e)}});$('refresh').onclick=refresh;$('manage').onclick=()=>P.auth==='local'?guard(async()=>toast('本机管理已解锁')):S.admin?api('logout').then(()=>{S.admin=false;text('manage','管理');toast('已锁定')}):guard(async()=>toast('已解锁'));
$('login-form').addEventListener('submit',async e=>{e.preventDefault();let button=e.submitter;button.disabled=true;try{await api('login',{password:$('admin-password').value});$('admin-password').value='';S.admin=true;text('manage','锁定');$('login-dialog').close();let fn=S.afterLogin;S.afterLogin=null;if(fn)await fn()}catch(e){err('login-error',e)}finally{button.disabled=false}});
$('account-form').addEventListener('invalid',e=>{if(e.target.closest('details'))$('location-details').open=true},true);$('account-form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;try{let account={label:$('label').value,student_id:$('student-id').value,password:$('school-password').value,browser_fingerprint:$('fingerprint').value,run_at:$('run-at').value,automation_enabled:$('enabled').checked,location:{mode:'fixed',name:$('location-name').value,latitude:Number($('latitude').value),longitude:Number($('longitude').value),coordinate_system:'gcj02',reverse_geocode:''}};if(S.edit)account.id=S.edit;let r=await api('save',{account});S.id=r.account.id;localStorage.setItem('moonuestc-account',S.id);$('school-password').value='';$('fingerprint').value='';$('account-dialog').close();await refresh();toast('已保存')}catch(e){err('account-error',e)}finally{$('save').disabled=false}});
$('delete').onclick=()=>{text('delete-name',$('label').value);$('delete-dialog').showModal()};$('confirm-delete').onclick=async()=>{let button=$('confirm-delete');button.disabled=true;try{await api('delete',{id:S.edit});$('delete-dialog').close();$('account-dialog').close();S.id='';await refresh();toast('已删除')}catch(e){err('account-error',e);$('delete-dialog').close()}finally{button.disabled=false}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('account-dialog').addEventListener('close',()=>{$('school-password').value='';$('fingerprint').value=''});$('login-dialog').addEventListener('close',()=>{$('admin-password').value=''});setInterval(()=>{if(!document.hidden)clock()},1000);setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});clock();refresh();})();
</script></html>
