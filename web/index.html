<!doctype html><html lang="zh-CN" data-app="moonuestc-openwrt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>晚安成电 · OpenWrt</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23cce7bc' d='M30 30A16 16 0 0 1 10 6a15 15 0 0 0 20 24'/%3E%3C/svg%3E">
<style>

ont:16px "Cascadia Code",Consolas,monospace;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}.divider{height:1px;background:var(--line);margin:27px 0 21px}.window-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.track{position:relative;height:7px;background:#28352a;margin:18px 0 10px}.range{position:absolute;left:25%;width:62.5%;height:7px;background:#637c50}.target{position:absolute;left:25.416%;top:-4px;width:2px;height:15px;background:var(--lime)}.axis{display:flex;justify-content:space-between;font:10px Consolas,monospace;color:var(--muted)}.status-panel{border-left:1px solid var(--line);padding:30px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.moon{width:104px;height:104px;background:var(--lime);border-radius:50%;position:relative;margin:0 0 22px;box-shadow:0 0 60px #d2e9b608}.moon:after{content:"";position:absolute;left:32px;top:-13px;width:100px;height:100px;border-radius:50%;background:var(--panel)}.status-title{font-size:26px;letter-spacing:2px;font-weight:400;margin:0 0 8px}.status-note{font-size:12px;color:var(--muted);max-width:260px;min-height:40px}.place{margin-top:26px;border-top:1px solid var(--line);padding-top:17px;width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.place strong{font-size:16px;font-weight:400}.place small{display:block;color:var(--muted);font-size:11px}.radius{font-size:25px;color:var(--lime)}.radius small{display:inline;margin-left:4px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fact{padding:22px 24px 22px 0}.fact+.fact{border-left:1px solid var(--line);padding-left:28px}.fact .label{font-size:11px;color:var(--muted);margin-bottom:8px}.fact strong{font-weight:400;font-size:18px}.fact small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.bottom{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head h2{font-weight:400;font-size:17px;margin:0;letter-spacing:1px}.refresh{background:none;color:var(--muted);border:1px solid var(--line);padding:5px 12px;border-radius:3px;cursor:pointer;font-size:11px}.refresh:hover,.refresh:focus-visible{color:var(--lime);border-color:var(--lime)}.history{list-style:none;margin:0;padding:0}.history li{display:grid;grid-template-columns:51px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #2a362c;font-size:12px}.history time{color:var(--muted);font:11px Consolas,monospace}.history em{font-style:normal;color:var(--lime);font-size:10px;letter-spacing:1px}.history .bad{color:var(--amber)}.empty{font-size:13px;color:var(--muted);padding:20px 0}.note{border-left:2px solid #6a8059;padding:0 0 0 20px;color:var(--muted);font-size:13px;line-height:1.9}.note strong{color:var(--ink);font-weight:400;display:block;margin-bottom:8px}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:38px;padding-top:17px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.footer a{text-decoration:none}.footer a:hover{text-decoration:underline}.error{color:var(--amber)}@media(max-width:700px){main{padding:22px 20px}.top{padding-bottom:16px}.intro{margin-top:26px;align-items:start;flex-direction:column;gap:10px}.date{font-size:11px}.hero,.bottom{grid-template-columns:minmax(0,1fr)}.clock-panel{min-width:0;padding:26px}.time{font-size:110px;letter-spacing:-5px;margin-top:15px}.status-panel{border-left:0;border-top:1px solid var(--line);padding:28px;min-height:280px}.moon{width:68px;height:68px;margin-bottom:16px}.moon:after{width:68px;height:68px;left:23px;top:-10px}.place{margin-top:16px}.facts{margin-top:20px}.fact{padding:17px 10px 17px 0}.fact+.fact{padding-left:14px}.fact strong{font-size:15px}.fact small{font-size:10px}.bottom{gap:26px}.footer{flex-direction:column;gap:5px}.small{letter-spacing:1px}.brand strong{font-size:15px}.online{font-size:10px}.window-top{font-size:11px}}@media(prefers-reduced-motion:no-preference){main{animation:arrive .5s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
<main><header class="top"><div class="brand"><span class="mark" aria-hidden="true">☾</span><div><strong>晚安成电</strong><span class="small">OPENWRT</span></div></div><div class="online" id="connection"><span class="dot"></span><span id="connection-text">正在连接路由器</span></div></header>
<section class="intro"><div><h1>签到状态</h1></div><time class="date" id="date">北京时间</time></section>
<section class="hero" aria-label="签到计划与状态"><div class="clock-panel"><div class="clock-title"><span class="eyebrow">每日签到 · 北京时间</span><span class="tag" id="plan">读取计划</span></div><div class="time" aria-label="每日执行时间"><span id="hour">21</span><i>:</i><span id="minute">01</span></div><div class="countdown"><span>距下次执行</span><b id="countdown">-- : -- : --</b></div><div class="divider"></div><div class="window-top"><span>学校允许时段</span><span id="window">尚未读取</span></div><div class="track" aria-hidden="true"><div class="range"></div><div class="target"></div></div><div class="axis"><span>20:00</span><span>21:00</span><span>22:00</span><span>23:00</span><span>24:00</span></div></div><div class="status-panel"><div class="moon" aria-hidden="true"></div><h2 class="status-title" id="status">读取状态中</h2><div class="status-note" id="status-note">稍候，正在读取路由器保存的结果。</div><div class="place"><div><strong id="location">未配置</strong><small>配置的签到地点</small></div><div class="radius"><span id="radius">—</span><small>米半径</small></div></div></div></section>
<section class="facts" aria-label="运行摘要"><div class="fact"><div class="label">学校认证</div><strong id="auth">—</strong><small id="auth-note">等待读取</small></div><div class="fact"><div class="label">最近读取的考勤</div><strong id="record">—</strong><small id="record-date">等待读取</small></div><div class="fact"><div class="label">最近任务</div><strong id="last-result">—</strong><small id="last-time">等待读取</small></div></section>
<section class="bottom"><div><div class="section-head"><h2>运行留痕</h2><button class="refresh" id="refresh" type="button">刷新状态 ↗</button></div><ul class="history" id="history"><li class="empty">暂无运行记录</li></ul></div><aside class="note"><strong>运行说明</strong><span id="explain">刷新只读取缓存，不触发签到。</span><p id="first-note">首次真实签到确认后，才会显示“已完成首签验证”。</p></aside></section>
<footer class="footer"><span id="updated">结果更新时间 —</span><span>路由器独立执行 · <a href="/cgi-bin/luci/">打开管理后台 ↗</a></span></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),zh=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}),dayFmt=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});let state=null,offset=0,busy=false;
const resultNames={skipped:'自动任务已跳过',auth_ready:'认证与状态查询通过',dry_run_ready:'位置与时段检查通过',confirmed:'签到成功并已回读',already_recorded:'学校已有今日记录',error:'本次任务未完成',submission_unknown:'提交结果待确认',record_changed:'学校记录有变化'},shortNames={skipped:'已暂停',auth_ready:'只读诊断通过',dry_run_ready:'位置检查通过',confirmed:'签到已确认',already_recorded:'已有考勤记录',error:'需要处理',submission_unknown:'等待确认',record_changed:'记录已变化'},reasonNames={automation_disabled:'自动任务已暂停',need_manual_mfa:'学校要求重新完成二次验证',need_manual_captcha:'学校要求本人完成验证码',outside_checkin_window:'当前不在学校允许的签到时段',outside_allowed_location:'配置位置不在学校允许范围内',daily_login_limit:'已达当日登录尝试上限',timeout:'学校连接超时',network_error:'学校网络连接失败',tls_error:'学校安全连接失败',login_rejected:'学校登录未成功',abnormal_record:'学校将考勤记录标记为异常',record_not_confirmed:'尚未读到签到成功记录'},recordNames={PENDING:'尚未签到',CHECKED_IN:'已签到',EXEMPT:'免签到',STUDENT_REPORTED:'已自行报备',INSTRUCTOR_REPORTED:'已由老师报备'};
function stamp(v){let d=new Date(v);return Number.isFinite(+d)?zh.format(d):'—'}function text(id,v){$(id).textContent=v}function today(){return dayFmt.format(new Date(Date.now()+offset))}function clock(){let d=new Date(Date.now()+offset);text('date',new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)+' · 北京时间');if(!state)return;let date=dayFmt.format(d).split('-').map(Number),t=(state.runAt||'21:01').split(':').map(Number),next=Date.UTC(date[0],date[1]-1,date[2],t[0]-8,t[1]);if(next<=+d)next+=86400000;let sec=Math.max(0,Math.floor((next-d)/1000));text('countdown',state.automationEnabled?[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(' : '):'计划尚未启用')}
function render(s){state=s;let run=s.lastRun||{},rec=s.lastRecord||{},auth=s.auth||{},parts=(s.runAt||'21:01').split(':');text('hour',parts[0]);text('minute',parts[1]);text('plan',s.automationEnabled?'每日自动执行':'计划已暂停');text('location',s.location?.name||'未配置');text('radius',s.location?.radiusMeter??'—');text('window',s.window?.start&&s.window?.end?s.window.start+' — '+s.window.end:'尚未读取');text('auth',auth.ok?'已验证连通':'尚未验证');text('auth-note',auth.checkedAt?'上次验证 '+stamp(auth.checkedAt):'等待学校登录验证');text('record',recordNames[rec.status]||'尚无记录');text('record-date',rec.businessDate?'业务日期 '+rec.businessDate:'执行后更新');text('last-result',shortNames[run.result]||'尚未运行');text('last-time',run.time?stamp(run.time):'等待首次执行');text('updated','结果更新时间 '+stamp(s.updatedAt));let checked=rec.businessDate===today()&&rec.status==='CHECKED_IN'&&rec.abnormalFlag===false,failed=run.result==='error'||run.result==='submission_unknown';text('status',checked?'今夜，已签到':!s.automationEnabled?'自动任务已暂停':failed?'需要留意':s.firstConfirmedAt?'等待今晚执行':'等待今晚首签');text('status-note',checked?'已读取学校的签到记录。':!s.automationEnabled?'暂停期间不会自动请求学校。':failed?(reasonNames[run.reason]||'请查看最近任务；不会把不明确的结果显示为成功。'):s.firstConfirmedAt?'将在设定时间自动执行，成功后回读确认。':run.result==='dry_run_ready'?'位置检查已通过，首次真实签到尚待验证。':'等待任务运行并读取学校结果。');text('first-note',s.firstConfirmedAt?'已完成首签验证 · '+stamp(s.firstConfirmedAt):'首次真实签到确认后，才会显示“已完成首签验证”。');const list=$('history');list.replaceChildren();for(const r of [...(s.history||[])].reverse().slice(0,5)){let li=document.createElement('li'),time=document.createElement('time'),name=document.createElement('span'),badge=document.createElement('em');time.textContent=stamp(r.time).slice(-5);time.dateTime=r.time;name.textContent=resultNames[r.result]||'任务记录';badge.textContent=r.result==='skipped'?'跳过':r.result==='error'||r.result==='submission_unknown'?'留意':'完成';if(badge.textContent==='留意')badge.className='bad';li.append(time,name,badge);list.append(li)}if(!list.children.length){let li=document.createElement('li');li.className='empty';li.textContent='暂无运行记录';list.append(li)}clock()}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;try{let r=await fetch('./status.json',{cache:'no-store'});if(!r.ok)throw Error();let date=Date.parse(r.headers.get('Date'));if(Number.isFinite(date))offset=date-Date.now();render(await r.json());$('connection').classList.remove('offline');text('connection-text','路由器已连接')}catch{ $('connection').classList.add('offline');text('connection-text','暂时无法读取路由器');if(!state){text('status','等待连接');text('status-note','请确认已连接这台路由器，再刷新页面。')}}finally{busy=false;$('refresh').disabled=false}}
$('refresh').addEventListener('click',refresh);setInterval(()=>{if(!document.hidden)clock()},1000);setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){clock();refresh()}});clock();refresh();})();
</script></html>
